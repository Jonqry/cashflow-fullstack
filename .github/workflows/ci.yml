name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    # Testes de integração da API, incluindo os de segurança (JWT, validação, limite de tentativas e headers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CashFlow.slnx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CashFlow.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CashFlow.Web/package-lock.json
      - run: npm ci
      - run: npm run build
